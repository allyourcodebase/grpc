name: Continuous Integration

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        zig-version: ["master", "0.17.0"]
        os: [ubuntu-latest, macos-latest]
        include:
          - zig-version: "0.16.0"
            os: ubuntu-latest
          - zig-version: "0.15.2"
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}
          # A Debug libgrpc build fills about 2.5 GB of cache, above the default 2 GiB limit
          # that empties it after each run. Compressed, it only takes about 0.5 GB of storage
          cache-size-limit: 4096

      - name: Build dependencies
        run: zig build -Dlink_mode=dynamic --summary all dependencies
      - name: Build libgrpc
        run: zig build -Dlink_mode=dynamic --summary new
      - name: Build test programs
        run: zig build -Dlink_mode=dynamic --summary new examples
      - name: Run tests
        run: zig build -Dlink_mode=dynamic --summary new test
